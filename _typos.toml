# Project vocabulary for the `typos` spell checker. Add real domain terms /
# proper nouns under extend-words so legitimate identifiers aren't flagged.
[default]
# 8-hex-character tokens are the ids we cite constantly in docs: git short SHAs
# and the leading segment of a GTD item UUID (e.g. `050252ba`, whose trailing
# `ba` typos reads as a misspelling of `by`/`be`). No English word is eight
# letters drawn only from a-f, so this ignores ids without weakening prose
# checking. Shorter SHA prefixes still need an extend-words entry (see `caf`).
extend-ignore-re = ["\\b[0-9a-f]{8}\\b"]

[default.extend-words]
aci = "aci"   # agent-computer interface (Anthropic's term), not a typo of ACPI
caf = "caf"   # leading letters of git SHAs we cite in docs (e.g. caf7549), and
              # the truncated "café" in the text-preview fixture — never "calf"

[files]
# `fixtures/*` are eval inputs, not project code — the workspace `exclude`s
# them from cargo, and typos skips them here for the same reason: a fixture
# may deliberately contain non-standard identifiers or partial-word test
# vectors (e.g. `"caf"` — the truncated "café" — in the text-preview fixture).
extend-exclude = ["CHANGELOG.md", "*.lock", "fixtures/**", "crates/harness/testdata/**/*.txt"]
