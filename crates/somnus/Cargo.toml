[package]
name = "somnus"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "KB nightly map-maintenance loop: a timer-invoked binary, no daemon."

[[bin]]
name = "somnus"
path = "src/main.rs"

[dependencies]
async-trait.workspace = true
clap.workspace = true
harness = { path = "../harness" }
reqwest.workspace = true
serde = { workspace = true }
serde_json.workspace = true
tokio = { workspace = true }

[dev-dependencies]
# `harness` dev-dep ADDS the default-off `test-support` feature so somnus's
# own test targets can drive the same scripted `MockBackend` harness's suite
# does. The feature never ships in a release build of either crate.
harness = { path = "../harness", features = ["test-support"] }
tempfile.workspace = true
# `test-util` is ADDITIVE here (the workspace tokio dep does not carry it) and
# exists ONLY to compile the `#[tokio::test(start_paused = true)]` timeout
# tests in `src/observer.rs` and `src/unit.rs`. The ROOT manifest is not
# touched.
tokio = { workspace = true, features = ["test-util"] }
wiremock.workspace = true

[lints]
workspace = true
