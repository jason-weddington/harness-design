[package]
name = "harness"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "Core agent-harness library."

# `test-support`: compiles `src/test_support.rs` (the scripted `MockBackend`
# and friends) for a CONSUMER's dev-test target. Default OFF, so nothing in
# the module ships in any release build — enabling the feature is a dev-only
# affordance for downstream crates' test suites, never a production one.
[features]
test-support = []

[dependencies]
askama.workspace = true
async-trait.workspace = true
aws-config.workspace = true
aws-sdk-bedrockruntime.workspace = true
aws-smithy-http-client.workspace = true
aws-smithy-runtime-api.workspace = true
aws-smithy-types.workspace = true
jsonschema.workspace = true
reqwest = { workspace = true }
rusqlite.workspace = true
serde = { workspace = true }
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true }

[dev-dependencies]
tempfile.workspace = true
wiremock.workspace = true

[lints]
workspace = true
